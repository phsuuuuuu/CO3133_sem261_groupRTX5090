model: deeplabv3_resnet50
weights_backbone: IMAGENET1K_V1

# Model 1: Frozen Backbone (train ASPP head only) - Synced with colab.ipynb
lr: 0.0001
head_lr: 0.0001
num_classes: 19
ignore_index: 255
seed: 666
epochs: 60
amp: true
batch_size: 8
num_workers: 4
pin_memory: true
max_train_batches: 0
max_eval_batches: 0
checkpoint_dir: checkpoints/deeplabv3/local
eval_every: 1
