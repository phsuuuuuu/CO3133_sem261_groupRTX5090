<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignment 2 - M1 Proposal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #525659;
        }

        #pdf-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 20px 0;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        #loading {
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>

<body>

    <div id="loading">
        Loading Assignment 2 M1 Proposal...
    </div>

    <div id="pdf-container"></div>


    <script type="module">

        import * as pdfjsLib from
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


        const pdfUrl =
            "reports/Assignment2_M1_RTX5090.pdf";


        const container =
            document.getElementById("pdf-container");

        const loading =
            document.getElementById("loading");


        async function renderPDF() {

            try {

                const pdf =
                    await pdfjsLib.getDocument(pdfUrl).promise;


                loading.style.display = "none";


                for (
                    let pageNumber = 1;
                    pageNumber <= pdf.numPages;
                    pageNumber++
                ) {

                    const page =
                        await pdf.getPage(pageNumber);


                    const originalViewport =
                        page.getViewport({ scale: 1 });


                    const maxWidth =
                        Math.min(window.innerWidth - 30, 1000);


                    const scale =
                        maxWidth / originalViewport.width;


                    const viewport =
                        page.getViewport({ scale: scale });


                    const canvas =
                        document.createElement("canvas");


                    const context =
                        canvas.getContext("2d");


                    const outputScale =
                        window.devicePixelRatio || 1;


                    canvas.width =
                        Math.floor(
                            viewport.width * outputScale
                        );


                    canvas.height =
                        Math.floor(
                            viewport.height * outputScale
                        );


                    canvas.style.width =
                        `${viewport.width}px`;


                    canvas.style.height =
                        `${viewport.height}px`;


                    container.appendChild(canvas);


                    const renderContext = {

                        canvasContext: context,

                        viewport: viewport,

                        transform:
                            outputScale !== 1
                            ? [
                                outputScale,
                                0,
                                0,
                                outputScale,
                                0,
                                0
                              ]
                            : null
                    };


                    await page.render(
                        renderContext
                    ).promise;
                }

            }

            catch (error) {

                console.error(error);

                loading.innerHTML =
                    "Unable to load the proposal PDF.";

            }

        }


        renderPDF();

    </script>

</body>

</html>
