<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Assignment 2 — M1 Proposal — RTX5090
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family: Arial, sans-serif;

            background: #525659;
        }


        /* ================================================= */
        /* HEADER */
        /* ================================================= */

        header {
            position: sticky;

            top: 0;
            left: 0;

            z-index: 100;

            width: 100%;
            min-height: 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding: 10px 24px;

            background: white;

            border-bottom: 1px solid #ddd;

            box-shadow:
                0 2px 7px rgba(0, 0, 0, 0.18);
        }


        .back-link {
            color: #0969da;

            text-decoration: none;

            font-weight: bold;

            white-space: nowrap;
        }


        .back-link:hover {
            text-decoration: underline;
        }


        .title {
            color: #222;

            font-weight: bold;

            text-align: right;
        }


        /* ================================================= */
        /* PDF VIEW */
        /* ================================================= */

        #pdf-container {
            width: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 20px;

            padding:
                25px
                15px
                60px
                15px;
        }


        .pdf-page {
            display: block;

            max-width: 100%;

            height: auto;

            background: white;

            box-shadow:
                0 3px 14px
                rgba(0, 0, 0, 0.45);
        }


        /* ================================================= */
        /* LOADING */
        /* ================================================= */

        #loading {
            padding: 70px 20px;

            color: white;

            text-align: center;

            font-size: 18px;
        }


        /* ================================================= */
        /* ERROR */
        /* ================================================= */

        #error {
            display: none;

            padding: 70px 20px;

            color: white;

            text-align: center;

            font-size: 18px;
        }


        #error a {
            color: white;
        }


        /* ================================================= */
        /* MOBILE */
        /* ================================================= */

        @media (max-width: 650px) {

            header {
                flex-direction: column;
                align-items: flex-start;

                gap: 4px;

                padding: 10px 15px;
            }


            .title {
                text-align: left;
                font-size: 14px;
            }


            #pdf-container {
                padding-left: 8px;
                padding-right: 8px;
            }

        }

    </style>

</head>


<body>


<header>

    <a
        class="back-link"
        href="assignment2.html">

        ← Back to Assignment 2

    </a>


    <div class="title">

        M1 — Dataset & Project Proposal

    </div>

</header>



<div id="loading">

    Loading M1 Proposal...

</div>



<div id="error">

    Unable to display the M1 Proposal.

    <br><br>

    <a
        href="../reports/Assignment2_M1_RTX5090.pdf"
        target="_blank">

        Open the PDF directly

    </a>

</div>



<div id="pdf-container"></div>



<script type="module">


    /*
        PDF.js

        Used only to DISPLAY the original PDF.

        The content of the PDF is not rewritten,
        shortened, summarized or modified.
    */

    import * as pdfjsLib from
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";



    /*
        Folder structure:

        docs/

        ├── assignment2/
        │   ├── assignment2.html
        │   └── m1.html
        │
        └── reports/
            └── Assignment2_M1_RTX5090.pdf


        m1.html is one folder below docs/.

        Therefore:

        ../reports/

        means:

        assignment2/
            ↓ go up
        docs/
            ↓
        reports/
    */


    const pdfUrl =
        "../reports/Assignment2_M1_RTX5090.pdf";



    const pdfContainer =
        document.getElementById("pdf-container");


    const loadingMessage =
        document.getElementById("loading");


    const errorMessage =
        document.getElementById("error");



    async function renderPDF() {


        try {


            /*
                Load original PDF
            */

            const loadingTask =
                pdfjsLib.getDocument(pdfUrl);


            const pdf =
                await loadingTask.promise;



            /*
                Hide loading message
            */

            loadingMessage.style.display =
                "none";



            /*
                Render every single page.

                Nothing is skipped.
            */

            for (

                let pageNumber = 1;

                pageNumber <= pdf.numPages;

                pageNumber++

            ) {


                const page =
                    await pdf.getPage(
                        pageNumber
                    );



                /*
                    Get original page dimensions.
                */

                const baseViewport =
                    page.getViewport({
                        scale: 1
                    });



                /*
                    Display width.

                    Desktop:
                    up to 1000 px.

                    Small screens:
                    width of browser minus margins.
                */

                const availableWidth =
                    Math.min(

                        window.innerWidth - 30,

                        1000

                    );



                /*
                    Maintain the exact PDF
                    aspect ratio.
                */

                const scale =
                    availableWidth /
                    baseViewport.width;



                const viewport =
                    page.getViewport({
                        scale: scale
                    });



                /*
                    Create canvas for this PDF page.
                */

                const canvas =
                    document.createElement(
                        "canvas"
                    );


                canvas.className =
                    "pdf-page";


                canvas.setAttribute(
                    "aria-label",
                    "PDF page " + pageNumber
                );



                const context =
                    canvas.getContext(
                        "2d"
                    );



                /*
                    High DPI support.

                    This makes text and diagrams
                    much sharper on high-resolution
                    monitors.
                */

                const outputScale =
                    window.devicePixelRatio || 1;



                canvas.width =
                    Math.floor(

                        viewport.width *
                        outputScale

                    );



                canvas.height =
                    Math.floor(

                        viewport.height *
                        outputScale

                    );



                canvas.style.width =
                    viewport.width + "px";



                canvas.style.height =
                    viewport.height + "px";



                /*
                    Add page to website.
                */

                pdfContainer.appendChild(
                    canvas
                );



                /*
                    High DPI transform.
                */

                const transform =

                    outputScale !== 1

                        ? [

                            outputScale,

                            0,

                            0,

                            outputScale,

                            0,

                            0

                        ]

                        : null;



                /*
                    Render actual PDF page.
                */

                await page.render({

                    canvasContext:
                        context,

                    viewport:
                        viewport,

                    transform:
                        transform

                }).promise;


            }


        }


        catch (error) {


            console.error(
                "Error loading PDF:",
                error
            );


            loadingMessage.style.display =
                "none";


            errorMessage.style.display =
                "block";


        }


    }



    /*
        Start rendering.
    */

    renderPDF();


</script>


</body>

</html>
